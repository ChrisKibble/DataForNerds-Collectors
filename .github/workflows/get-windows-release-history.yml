name: Get-WindowsReleaseHistory

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Prevent a workflow_dispatch run from overlapping an in-flight cron run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collector:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-collector.yml
    secrets: inherit
    with:
      collector: Get-WindowsReleaseHistory
      datasets: |
        [
          {
            "name": "windows-release-history",
            "minRecords": 5,
            "maxRecords": 100,
            "requiredFields": ["OSType", "MajorVersion", "WindowsVersion", "OSBuild", "FullVersion"],
            "keyFields": ["MajorVersion", "WindowsVersion", "OSBuild"],
            "nonEmptyFields": ["MajorVersion", "WindowsVersion", "OSBuild"],
            "sourceUrls": [
              "https://learn.microsoft.com/en-us/windows/release-health/release-information",
              "https://learn.microsoft.com/en-us/windows/release-health/windows11-release-information"
            ]
          }
        ]
