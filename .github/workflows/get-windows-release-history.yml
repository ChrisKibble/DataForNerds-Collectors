name: Get-WindowsReleaseHistory

on:
  schedule:
    - cron: '45 6 * * *'
  workflow_dispatch:

jobs:
  run-collector:
    name: Run Get-WindowsReleaseHistory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell (latest stable)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEB_URL=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PowerShell/PowerShell/releases/tags/v7.6.2 \
            | grep -oE '"browser_download_url": *"[^"]+deb_amd64\.deb"' \
            | head -n 1 \
            | sed -E 's/.*"(https[^"]+)".*/\1/')
          if [ -z "${DEB_URL}" ]; then
            echo "Could not resolve latest PowerShell .deb asset URL." >&2
            exit 1
          fi
          echo "Downloading: ${DEB_URL}"
          curl -fsSL -o /tmp/powershell.deb "${DEB_URL}"
          sudo dpkg -i /tmp/powershell.deb || sudo apt-get install -f -y
          pwsh --version

      - name: Fetch current JSON from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          OUTPUT=$(npx wrangler@4 r2 object get dfn-collectors/v2/windows-release-history.json --file=current.json --remote 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "(not found|does not exist|NoSuchKey|10007)"; then
              echo "Object not found in R2 (first run) — continuing without baseline."
            else
              echo "::error::R2 fetch failed unexpectedly:"
              echo "$OUTPUT"
              exit 1
            fi
          fi

      - name: Run Get-WindowsReleaseHistory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module "$env:GITHUB_WORKSPACE/Modules/DataForNerdsCollectors/DataForNerdsCollectors.psd1" -Force

          $now     = [DateTime]::UtcNow.ToString('o')
          $maxAttempts = 3
          $results = $null
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                  $results = Get-WindowsReleaseHistory
                  break
              } catch {
                  Write-Host "Attempt $attempt of $maxAttempts failed: $_"
                  if ($attempt -eq $maxAttempts) { throw }
                  Start-Sleep -Seconds (30 * $attempt)
              }
          }
          Write-Host "Returned $($results.Count) record(s)."

          # --- Validation ---
          $requiredFields = @('OSType','MajorVersion','WindowsVersion','OSBuild','FullVersion')
          for ($i = 0; $i -lt $results.Count; $i++) {
              $missing = $requiredFields | Where-Object { $_ -notin $results[$i].PSObject.Properties.Name }
              if ($missing) { throw "Record $i is missing fields: $($missing -join ', ')" }
          }
          if ($results.Count -lt 5) { throw "Expected at least 5 records, got $($results.Count)" }
          Write-Host "Validation passed."

          function Get-LastModified($newData, $currentFile) {
              if (Test-Path $currentFile) {
                  $current     = Get-Content $currentFile -Raw | ConvertFrom-Json
                  $newDataJson = $newData      | ConvertTo-Json -Depth 10 -Compress
                  $oldDataJson = $current.data | ConvertTo-Json -Depth 10 -Compress
                  if ($newDataJson -ne $oldDataJson) { return $script:now }
                  return $current.metadata.lastModified
              }
              return $script:now
          }

          function New-Envelope($dataset, $sourceUrls, $data, $lastModified) {
              [PSCustomObject]@{
                  metadata = [PSCustomObject]@{
                      provider      = 'DataForNerds'
                      apiVersion    = 'v2'
                      dataset       = $dataset
                      recordCount   = @($data).Count
                      sourceUrls    = $sourceUrls
                      lastModified  = $lastModified
                      lastCollected = $script:now
                  }
                  data = $data
              }
          }

          $ws = $env:GITHUB_WORKSPACE
          $lm = Get-LastModified $results "$ws/current.json"
          Write-Host "windows-release-history lastModified: $lm"
          New-Envelope 'windows-release-history' @(
              'https://learn.microsoft.com/en-us/windows/release-health/release-information',
              'https://learn.microsoft.com/en-us/windows/release-health/windows11-release-information'
          ) $results $lm | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output.json" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "DATA_CHANGED=$(($lm -eq $now).ToString().ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "LAST_MODIFIED=$lm"

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 r2 object put dfn-collectors/v2/windows-release-history.json --file=output.json --content-type=application/json --remote

      - name: Update index.json in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(npx wrangler@4 r2 object get dfn-collectors/v2/index.json --file=index-current.json --remote 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "(not found|does not exist|NoSuchKey|10007)"; then
              echo "index.json not found in R2 — skipping index update."
              exit 0
            else
              echo "::error::R2 fetch of index.json failed unexpectedly:"
              echo "$OUTPUT"
              exit 1
            fi
          fi
          OLD_LM=$(jq -r '.datasets[] | select(.name == "windows-release-history") | .lastModified // "null"' index-current.json)
          jq --arg name "windows-release-history" --arg lm "$LAST_MODIFIED" \
            '.datasets |= map(if .name == $name then .lastModified = $lm else . end)' \
            index-current.json > index-updated.json
          npx wrangler@4 r2 object put dfn-collectors/v2/index.json --file=index-updated.json --content-type=application/json --remote
          if [ "$OLD_LM" != "$LAST_MODIFIED" ]; then
            curl -fsSL -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"files":["https://api.datafornerds.io/v2/index.json"]}'
          fi

      - name: Purge Cloudflare cache
        if: env.DATA_CHANGED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -fsSL -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"files":["https://api.datafornerds.io/v2/windows-release-history.json"]}'

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'collector-failure';
            const title = `[Collector Failure] ${{ github.workflow }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **${{ github.workflow }}** workflow failed.`,
              '',
              `- **Run:** ${runUrl}`,
              `- **Time:** ${new Date().toISOString()}`,
              `- **Trigger:** ${{ github.event_name }}`,
              '',
              `Check the [workflow logs](${runUrl}) for details.`
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `### Failure recurrence\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            }
