name: Run Collector

# Reusable workflow shared by all collector workflows. Callers provide the
# collector function name and a JSON array describing the dataset(s) it
# publishes; everything else (fetch baselines, run with retry, validate,
# envelope, changelog, upload, index update, cache purge, failure issue)
# lives here once instead of in every workflow.

on:
  workflow_call:
    inputs:
      collector:
        description: Exported module function to run (e.g. Get-ChassisTypes)
        required: true
        type: string
      datasets:
        description: >-
          JSON array of dataset definitions. Each entry has name, minRecords,
          maxRecords, requiredFields, keyFields, nonEmptyFields, sourceUrls,
          and an optional filter ({"field": ..., "equals": ...}) applied to
          the collector output before validation and publishing.
        required: true
        type: string

jobs:
  collect:
    name: Run ${{ inputs.collector }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATASETS: ${{ inputs.datasets }}
    outputs:
      lastmodified: ${{ steps.collect.outputs.lastmodified }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PowerShell
        uses: ./.github/actions/install-powershell

      - name: Fetch current baselines from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fetch_baseline() {
            local key=$1 file=$2
            set +e
            OUTPUT=$(npx wrangler@4.149.0 r2 object get "dfn-collectors/$key" --file="$file" --remote 2>&1)
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then
              if echo "$OUTPUT" | grep -qiE "(not found|does not exist|NoSuchKey|10007)"; then
                echo "$key not found in R2 (first run) — continuing without baseline."
              else
                echo "::error::R2 fetch failed unexpectedly for $key:"
                echo "$OUTPUT"
                exit 1
              fi
            fi
          }
          for name in $(jq -r '.[].name' <<< "$DATASETS"); do
            fetch_baseline "v2/microsoft/$name.json" "current-$name.json"
            fetch_baseline "v2/microsoft/$name.changelog.json" "changelog-current-$name.json"
          done

      - name: Run ${{ inputs.collector }}
        id: collect
        shell: pwsh
        env:
          DFN_BOT_NAME: ${{ secrets.DFN_BOT_NAME }}
          DFN_BOT_INFO: ${{ secrets.DFN_BOT_INFO }}
          # Make source-fetch failures throw inside the module (instead of
          # degrading to partial data with a warning) so the retry loop and
          # record-count validation see them.
          DFN_STRICT_FETCH: 'true'
          COLLECTOR: ${{ inputs.collector }}
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module "$env:GITHUB_WORKSPACE/Modules/DataForNerdsCollectors/DataForNerdsCollectors.psd1" -Force
          . "$env:GITHUB_WORKSPACE/.github/scripts/envelope-helpers.ps1"

          $datasets = $env:DATASETS | ConvertFrom-Json
          $now      = [DateTime]::UtcNow.ToString('o')

          # Validation sits inside the retry loop: the collectors warn (not
          # throw) on fetch failures, so a transient HTTP blip surfaces as a
          # short record count — that has to trigger a retry, not a hard fail.
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                  $results = @(& $env:COLLECTOR)
                  Write-Host "Returned $($results.Count) total record(s)."

                  foreach ($ds in $datasets) {
                      $data = $results
                      if ($ds.PSObject.Properties['filter'] -and $ds.filter) {
                          $field = $ds.filter.field
                          $value = $ds.filter.equals
                          $data  = @($results | Where-Object { $_.$field -eq $value })
                      }

                      if ($data.Count -lt $ds.minRecords) { throw "$($ds.name): expected at least $($ds.minRecords) records, got $($data.Count)" }
                      if ($data.Count -gt $ds.maxRecords) { throw "$($ds.name): expected at most $($ds.maxRecords) records, got $($data.Count)" }

                      for ($i = 0; $i -lt $data.Count; $i++) {
                          $record  = $data[$i]
                          $missing = @($ds.requiredFields | Where-Object { $_ -notin $record.PSObject.Properties.Name })
                          if ($missing) { throw "$($ds.name): record $i is missing fields: $($missing -join ', ')" }
                          $empty = @($ds.nonEmptyFields | Where-Object {
                              $v = $record.$_
                              $null -eq $v -or ($v -is [string] -and [string]::IsNullOrWhiteSpace($v))
                          })
                          if ($empty) { throw "$($ds.name): record $i has null/empty values for: $($empty -join ', ')" }
                      }

                      $ds | Add-Member -NotePropertyName data -NotePropertyValue $data -Force
                      Write-Host "$($ds.name): $($data.Count) record(s) validated."
                  }
                  break
              } catch {
                  Write-Host "Attempt $attempt of $maxAttempts failed: $_"
                  if ($attempt -eq $maxAttempts) { throw }
                  Start-Sleep -Seconds (30 * $attempt)
              }
          }

          $ws           = $env:GITHUB_WORKSPACE
          $changed      = @()
          $lastModified = [ordered]@{}

          foreach ($ds in $datasets) {
              $lm = Get-LastModified $ds.data "$ws/current-$($ds.name).json" $now
              Write-Host "$($ds.name) lastModified: $lm"
              New-Envelope $ds.name @($ds.sourceUrls) $ds.data $lm $now |
                  ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output-$($ds.name).json" -Encoding utf8
              $lastModified[$ds.name] = $lm
              if ($lm -eq $now) { $changed += $ds.name }

              # --- Changelog ---
              if ($lm -eq $now -and (Test-Path "$ws/current-$($ds.name).json")) {
                  $current = Get-Content "$ws/current-$($ds.name).json" -Raw | ConvertFrom-Json
                  $changes = Compare-DataRecords -OldData $current.data -NewData $ds.data -KeyFields $ds.keyFields
                  if (@($changes.added).Count -gt 0 -or @($changes.removed).Count -gt 0 -or @($changes.modified).Count -gt 0) {
                      $entry = New-ChangelogEntry -Changes $changes -Timestamp $now
                      $existingChangelog = $null
                      if (Test-Path "$ws/changelog-current-$($ds.name).json") {
                          $existingChangelog = Get-Content "$ws/changelog-current-$($ds.name).json" -Raw | ConvertFrom-Json
                      }
                      $changelog = Update-Changelog -ExistingChangelog $existingChangelog -NewEntry $entry -Dataset $ds.name
                      $changelog | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/changelog-output-$($ds.name).json" -Encoding utf8
                      Write-Host "$($ds.name) changelog: $(@($changes.added).Count) added, $(@($changes.removed).Count) removed, $(@($changes.modified).Count) modified"
                  }
              }
          }

          ConvertTo-Json -InputObject @($changed) -Compress | Set-Content -Path "$ws/changed-datasets.json" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "lastmodified=$(ConvertTo-Json -InputObject ([PSCustomObject]$lastModified) -Compress)"

      - name: Validate output against schema
        run: |
          pip install -q check-jsonschema==0.38.2
          for name in $(jq -r '.[].name' <<< "$DATASETS"); do
            check-jsonschema --schemafile "https://api.datafornerds.io/v2/microsoft/schemas/$name.schema.json" "output-$name.json"
          done

      - name: Upload datasets to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for name in $(jq -r '.[].name' <<< "$DATASETS"); do
            npx wrangler@4.149.0 r2 object put "dfn-collectors/v2/microsoft/$name.json" --file="output-$name.json" --content-type=application/json --remote
          done

      - name: Upload changelogs to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Changelog files only exist for datasets whose data changed this run.
          for name in $(jq -r '.[].name' <<< "$DATASETS"); do
            if [ -f "changelog-output-$name.json" ]; then
              npx wrangler@4.149.0 r2 object put "dfn-collectors/v2/microsoft/$name.changelog.json" --file="changelog-output-$name.json" --content-type=application/json --remote
            fi
          done

      - name: Purge Cloudflare cache for changed datasets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          if [ "$(jq 'length' changed-datasets.json)" -eq 0 ]; then
            echo "No datasets changed — skipping purge."
            exit 0
          fi
          jq '{files: [.[] | "https://api.datafornerds.io/v2/microsoft/\(.).json"]}' changed-datasets.json | \
            curl -fsSL -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @- \
            || echo "::warning::Cache purge failed — stale content will expire within 6h."

  publish-index:
    name: Update index.json
    needs: collect
    runs-on: ubuntu-latest
    permissions: {}
    # Serialized across all collector workflows so concurrent runs can't
    # revert each other's read-modify-write of the shared index.json.
    concurrency:
      group: index-json-update
      cancel-in-progress: false

    steps:
      - name: Update index.json in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          LM_MAP: ${{ needs.collect.outputs.lastmodified }}
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(npx wrangler@4.149.0 r2 object get dfn-collectors/v2/index.json --file=index-current.json --remote 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "(not found|does not exist|NoSuchKey|10007)"; then
              echo "index.json not found in R2 — skipping index update."
              exit 0
            else
              echo "::error::R2 fetch of index.json failed unexpectedly:"
              echo "$OUTPUT"
              exit 1
            fi
          fi
          CHANGED=$(jq --argjson lm "$LM_MAP" \
            '[.datasets[] | select($lm[.name] != null and .lastModified != $lm[.name])] | length' \
            index-current.json)
          jq --argjson lm "$LM_MAP" \
            '.datasets |= map(if $lm[.name] != null then .lastModified = $lm[.name] else . end)' \
            index-current.json > index-updated.json
          npx wrangler@4.149.0 r2 object put dfn-collectors/v2/index.json --file=index-updated.json --content-type=application/json --remote
          if [ "$CHANGED" -gt 0 ]; then
            curl -fsSL -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"files":["https://api.datafornerds.io/v2/index.json"]}' \
              || echo "::warning::index.json cache purge failed — stale content will expire within 6h."
          fi

  report-failure:
    name: Report failure
    needs: [collect, publish-index]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create or update failure issue
        uses: actions/github-script@v9
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const label = 'collector-failure';
            const workflowName = process.env.WORKFLOW_NAME;
            const title = `[Collector Failure] ${workflowName}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **${workflowName}** workflow failed.`,
              '',
              `- **Run:** ${runUrl}`,
              `- **Time:** ${new Date().toISOString()}`,
              `- **Trigger:** ${process.env.EVENT_NAME}`,
              '',
              `Check the [workflow logs](${runUrl}) for details.`
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `### Failure recurrence\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            }
