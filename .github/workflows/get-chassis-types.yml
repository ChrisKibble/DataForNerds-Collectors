name: Get-ChassisTypes

on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Prevent a workflow_dispatch run from overlapping an in-flight cron run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collector:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-collector.yml
    secrets: inherit
    with:
      collector: Get-ChassisTypes
      datasets: |
        [
          {
            "name": "chassis-types",
            "minRecords": 20,
            "maxRecords": 50,
            "requiredFields": ["ID", "Type"],
            "keyFields": ["ID"],
            "nonEmptyFields": ["ID"],
            "sourceUrls": [
              "https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-systemenclosure"
            ]
          }
        ]
