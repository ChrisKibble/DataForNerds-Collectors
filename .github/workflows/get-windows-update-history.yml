name: Get-WindowsUpdateHistory

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-collector:
    name: Run Get-WindowsUpdateHistory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell (latest stable)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Install the latest stable PowerShell .deb directly from the
          # project's GitHub release. The aka.ms/install-powershell.sh
          # script does not yet support Ubuntu 24.04 (current ubuntu-latest).
          # Using GITHUB_TOKEN to avoid the unauthenticated rate limit.
          DEB_URL=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PowerShell/PowerShell/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]+deb_amd64\.deb"' \
            | head -n 1 \
            | sed -E 's/.*"(https[^"]+)".*/\1/')
          if [ -z "${DEB_URL}" ]; then
            echo "Could not resolve latest PowerShell .deb asset URL." >&2
            exit 1
          fi
          echo "Downloading: ${DEB_URL}"
          curl -fsSL -o /tmp/powershell.deb "${DEB_URL}"
          sudo dpkg -i /tmp/powershell.deb || sudo apt-get install -f -y
          pwsh --version

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Fetch current baselines from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fetch_baseline() {
            local key=$1 file=$2
            set +e
            OUTPUT=$(wrangler r2 object get "dfn-collectors/$key" --file="$file" --remote 2>&1)
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then
              if echo "$OUTPUT" | grep -qiE "(not found|does not exist|NoSuchKey|10007)"; then
                echo "$key not found in R2 (first run) — continuing without baseline."
              else
                echo "::error::R2 fetch failed unexpectedly for $key:"
                echo "$OUTPUT"
                exit 1
              fi
            fi
          }
          fetch_baseline v2/windows-update-history.json current-all.json
          fetch_baseline v2/windows-10-update-history.json current-win10.json
          fetch_baseline v2/windows-11-update-history.json current-win11.json

      - name: Run Get-WindowsUpdateHistory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module "$env:GITHUB_WORKSPACE/Modules/DataForNerdsCollectors/DataForNerdsCollectors.psd1" -Force

          $now     = [DateTime]::UtcNow.ToString('o')
          $maxAttempts = 3
          $results = $null
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                  $results = Get-WindowsUpdateHistory
                  break
              } catch {
                  Write-Host "Attempt $attempt of $maxAttempts failed: $_"
                  if ($attempt -eq $maxAttempts) { throw }
                  Start-Sleep -Seconds (30 * $attempt)
              }
          }
          $win10   = $results | Where-Object { $_.MajorVersion -eq 10 }
          $win11   = $results | Where-Object { $_.MajorVersion -eq 11 }
          Write-Host "Returned $($results.Count) total record(s): $($win10.Count) Win10, $($win11.Count) Win11."

          # --- Validation ---
          $requiredFields = @('OSType','MajorVersion','WindowsVersion','KBNumber','OSBuild','FullVersion','ReleaseDate','ReleaseType','ArticleUrl')
          for ($i = 0; $i -lt $results.Count; $i++) {
              $missing = $requiredFields | Where-Object { $_ -notin $results[$i].PSObject.Properties.Name }
              if ($missing) { throw "Record $i is missing fields: $($missing -join ', ')" }
          }
          if ($results.Count -lt 500) { throw "Expected at least 500 total records, got $($results.Count)" }
          if ($win10.Count   -lt 200) { throw "Expected at least 200 Win10 records, got $($win10.Count)" }
          if ($win11.Count   -lt  50) { throw "Expected at least 50 Win11 records, got $($win11.Count)" }
          Write-Host "Validation passed."

          function Get-LastModified($newData, $currentFile) {
              if (Test-Path $currentFile) {
                  $current     = Get-Content $currentFile -Raw | ConvertFrom-Json
                  $newDataJson = $newData      | ConvertTo-Json -Depth 10 -Compress
                  $oldDataJson = $current.data | ConvertTo-Json -Depth 10 -Compress
                  if ($newDataJson -ne $oldDataJson) { return $script:now }
                  return $current.metadata.lastModified
              }
              return $script:now
          }

          function New-Envelope($dataset, $sourceUrls, $data, $lastModified) {
              [PSCustomObject]@{
                  metadata = [PSCustomObject]@{
                      provider      = 'DataForNerds'
                      apiVersion    = 'v2'
                      dataset       = $dataset
                      recordCount   = @($data).Count
                      sourceUrls    = $sourceUrls
                      lastModified  = $lastModified
                      lastCollected = $script:now
                  }
                  data = $data
              }
          }

          $ws = $env:GITHUB_WORKSPACE

          # All updates
          $lm = Get-LastModified $results "$ws/current-all.json"
          Write-Host "windows-update-history    lastModified: $lm"
          New-Envelope 'windows-update-history' @(
              'https://support.microsoft.com/en-us/topic/windows-10-update-history-e6058e7c-4116-38f1-b984-4fcacfba5e5d',
              'https://aka.ms/Windows11UpdateHistory',
              'https://support.microsoft.com/en-us/topic/release-notes-for-hotpatch-on-windows-11-enterprise-version-25h2-0bbaa1c7-5070-41ca-a7c9-4ead79602dbf'
          ) $results $lm | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output-all.json" -Encoding utf8

          # Windows 10 only
          $lm = Get-LastModified $win10 "$ws/current-win10.json"
          Write-Host "windows-10-update-history lastModified: $lm"
          New-Envelope 'windows-10-update-history' @(
              'https://support.microsoft.com/en-us/topic/windows-10-update-history-e6058e7c-4116-38f1-b984-4fcacfba5e5d'
          ) $win10 $lm | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output-win10.json" -Encoding utf8

          # Windows 11 only
          $lm = Get-LastModified $win11 "$ws/current-win11.json"
          Write-Host "windows-11-update-history lastModified: $lm"
          New-Envelope 'windows-11-update-history' @(
              'https://aka.ms/Windows11UpdateHistory',
              'https://support.microsoft.com/en-us/topic/release-notes-for-hotpatch-on-windows-11-enterprise-version-25h2-0bbaa1c7-5070-41ca-a7c9-4ead79602dbf'
          ) $win11 $lm | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output-win11.json" -Encoding utf8

      - name: Upload windows-update-history.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 object put dfn-collectors/v2/windows-update-history.json --file=output-all.json --content-type=application/json --remote

      - name: Upload windows-10-update-history.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 object put dfn-collectors/v2/windows-10-update-history.json --file=output-win10.json --content-type=application/json --remote

      - name: Upload windows-11-update-history.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 object put dfn-collectors/v2/windows-11-update-history.json --file=output-win11.json --content-type=application/json --remote

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'collector-failure';
            const title = `[Collector Failure] ${{ github.workflow }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **${{ github.workflow }}** workflow failed.`,
              '',
              `- **Run:** ${runUrl}`,
              `- **Time:** ${new Date().toISOString()}`,
              `- **Trigger:** ${{ github.event_name }}`,
              '',
              `Check the [workflow logs](${runUrl}) for details.`
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `### Failure recurrence\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            }
