name: Get-WindowsUpdateHistory

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-collector:
    name: Run Get-WindowsUpdateHistory
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell (latest stable)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Install the latest stable PowerShell .deb directly from the
          # project's GitHub release. The aka.ms/install-powershell.sh
          # script does not yet support Ubuntu 24.04 (current ubuntu-latest).
          # Using GITHUB_TOKEN to avoid the unauthenticated rate limit.
          DEB_URL=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PowerShell/PowerShell/releases/tags/v7.6.2 \
            | grep -oE '"browser_download_url": *"[^"]+deb_amd64\.deb"' \
            | head -n 1 \
            | sed -E 's/.*"(https[^"]+)".*/\1/')
          if [ -z "${DEB_URL}" ]; then
            echo "Could not resolve latest PowerShell .deb asset URL." >&2
            exit 1
          fi
          echo "Downloading: ${DEB_URL}"
          curl -fsSL -o /tmp/powershell.deb "${DEB_URL}"
          sudo dpkg -i /tmp/powershell.deb || sudo apt-get install -f -y
          pwsh --version

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Fetch current baselines from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          fetch_baseline() {
            local key=$1 file=$2
            set +e
            OUTPUT=$(wrangler r2 object get "dfn-collectors/$key" --file="$file" --remote 2>&1)
            RC=$?
            set -e
            if [ $RC -ne 0 ]; then
              if echo "$OUTPUT" | grep -qiE "(not found|does not exist|NoSuchKey|10007)"; then
                echo "$key not found in R2 (first run) — continuing without baseline."
              else
                echo "::error::R2 fetch failed unexpectedly for $key:"
                echo "$OUTPUT"
                exit 1
              fi
            fi
          }
          fetch_baseline v2/windows-update-history.json current-all.json
          fetch_baseline v2/windows-10-update-history.json current-win10.json
          fetch_baseline v2/windows-11-update-history.json current-win11.json

      - name: Run Get-WindowsUpdateHistory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module "$env:GITHUB_WORKSPACE/Modules/DataForNerdsCollectors/DataForNerdsCollectors.psd1" -Force
          . "$env:GITHUB_WORKSPACE/.github/scripts/envelope-helpers.ps1"

          $now     = [DateTime]::UtcNow.ToString('o')
          $maxAttempts = 3
          $results = $null
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
              try {
                  $results = Get-WindowsUpdateHistory
                  break
              } catch {
                  Write-Host "Attempt $attempt of $maxAttempts failed: $_"
                  if ($attempt -eq $maxAttempts) { throw }
                  Start-Sleep -Seconds (30 * $attempt)
              }
          }
          $win10   = $results | Where-Object { $_.MajorVersion -eq 10 }
          $win11   = $results | Where-Object { $_.MajorVersion -eq 11 }
          Write-Host "Returned $($results.Count) total record(s): $($win10.Count) Win10, $($win11.Count) Win11."

          # --- Validation ---
          $requiredFields = @('OSType','MajorVersion','WindowsVersion','KBNumber','OSBuild','FullVersion','ReleaseDate','ReleaseType','ArticleUrl')
          for ($i = 0; $i -lt $results.Count; $i++) {
              $missing = $requiredFields | Where-Object { $_ -notin $results[$i].PSObject.Properties.Name }
              if ($missing) { throw "Record $i is missing fields: $($missing -join ', ')" }
          }
          if ($results.Count -lt 500) { throw "Expected at least 500 total records, got $($results.Count)" }
          if ($win10.Count   -lt 200) { throw "Expected at least 200 Win10 records, got $($win10.Count)" }
          if ($win11.Count   -lt  50) { throw "Expected at least 50 Win11 records, got $($win11.Count)" }
          Write-Host "Validation passed."

          $ws = $env:GITHUB_WORKSPACE

          # All updates
          $lmAll = Get-LastModified $results "$ws/current-all.json" $now
          Write-Host "windows-update-history    lastModified: $lmAll"
          New-Envelope 'windows-update-history' @(
              'https://support.microsoft.com/en-us/topic/windows-10-update-history-e6058e7c-4116-38f1-b984-4fcacfba5e5d',
              'https://aka.ms/Windows11UpdateHistory',
              'https://support.microsoft.com/en-us/topic/release-notes-for-hotpatch-on-windows-11-enterprise-version-25h2-0bbaa1c7-5070-41ca-a7c9-4ead79602dbf'
          ) $results $lmAll $now | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output-all.json" -Encoding utf8

          # Windows 10 only
          $lmWin10 = Get-LastModified $win10 "$ws/current-win10.json" $now
          Write-Host "windows-10-update-history lastModified: $lmWin10"
          New-Envelope 'windows-10-update-history' @(
              'https://support.microsoft.com/en-us/topic/windows-10-update-history-e6058e7c-4116-38f1-b984-4fcacfba5e5d'
          ) $win10 $lmWin10 $now | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output-win10.json" -Encoding utf8

          # Windows 11 only
          $lmWin11 = Get-LastModified $win11 "$ws/current-win11.json" $now
          Write-Host "windows-11-update-history lastModified: $lmWin11"
          New-Envelope 'windows-11-update-history' @(
              'https://aka.ms/Windows11UpdateHistory',
              'https://support.microsoft.com/en-us/topic/release-notes-for-hotpatch-on-windows-11-enterprise-version-25h2-0bbaa1c7-5070-41ca-a7c9-4ead79602dbf'
          ) $win11 $lmWin11 $now | ConvertTo-Json -Depth 10 | Set-Content -Path "$ws/output-win11.json" -Encoding utf8

          Add-Content -Path $env:GITHUB_ENV -Value "ALL_CHANGED=$(($lmAll -eq $now).ToString().ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "WIN10_CHANGED=$(($lmWin10 -eq $now).ToString().ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "WIN11_CHANGED=$(($lmWin11 -eq $now).ToString().ToLower())"
          Add-Content -Path $env:GITHUB_ENV -Value "LAST_MODIFIED_ALL=$lmAll"
          Add-Content -Path $env:GITHUB_ENV -Value "LAST_MODIFIED_WIN10=$lmWin10"
          Add-Content -Path $env:GITHUB_ENV -Value "LAST_MODIFIED_WIN11=$lmWin11"

      - name: Upload windows-update-history.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 object put dfn-collectors/v2/windows-update-history.json --file=output-all.json --content-type=application/json --remote

      - name: Upload windows-10-update-history.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 object put dfn-collectors/v2/windows-10-update-history.json --file=output-win10.json --content-type=application/json --remote

      - name: Upload windows-11-update-history.json to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 object put dfn-collectors/v2/windows-11-update-history.json --file=output-win11.json --content-type=application/json --remote

      - name: Update index.json in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          set +e
          OUTPUT=$(wrangler r2 object get dfn-collectors/v2/index.json --file=index-current.json --remote 2>&1)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if echo "$OUTPUT" | grep -qiE "(not found|does not exist|NoSuchKey|10007)"; then
              echo "index.json not found in R2 — skipping index update."
              exit 0
            else
              echo "::error::R2 fetch of index.json failed unexpectedly:"
              echo "$OUTPUT"
              exit 1
            fi
          fi
          LAST_MODIFIED_ALL=$(jq -r '.metadata.lastModified' output-all.json)
          LAST_MODIFIED_WIN10=$(jq -r '.metadata.lastModified' output-win10.json)
          LAST_MODIFIED_WIN11=$(jq -r '.metadata.lastModified' output-win11.json)
          OLD_LM_ALL=$(jq -r '.datasets[] | select(.name == "windows-update-history") | .lastModified // "null"' index-current.json)
          OLD_LM_WIN10=$(jq -r '.datasets[] | select(.name == "windows-10-update-history") | .lastModified // "null"' index-current.json)
          OLD_LM_WIN11=$(jq -r '.datasets[] | select(.name == "windows-11-update-history") | .lastModified // "null"' index-current.json)
          jq \
            --arg all   "$LAST_MODIFIED_ALL" \
            --arg win10 "$LAST_MODIFIED_WIN10" \
            --arg win11 "$LAST_MODIFIED_WIN11" \
            '.datasets |= map(
              if   .name == "windows-update-history"    then .lastModified = $all
              elif .name == "windows-10-update-history" then .lastModified = $win10
              elif .name == "windows-11-update-history" then .lastModified = $win11
              else . end)' \
            index-current.json > index-updated.json
          wrangler r2 object put dfn-collectors/v2/index.json --file=index-updated.json --content-type=application/json --remote
          if [ "$OLD_LM_ALL" != "$LAST_MODIFIED_ALL" ] || [ "$OLD_LM_WIN10" != "$LAST_MODIFIED_WIN10" ] || [ "$OLD_LM_WIN11" != "$LAST_MODIFIED_WIN11" ]; then
            curl -fsSL -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"files":["https://api.datafornerds.io/v2/index.json"]}' \
              || echo "::warning::index.json cache purge failed — stale content will expire within 6h."
          fi

      - name: Purge Cloudflare cache for changed datasets
        if: env.ALL_CHANGED == 'true' || env.WIN10_CHANGED == 'true' || env.WIN11_CHANGED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          files=()
          [ "$ALL_CHANGED"   = "true" ] && files+=("https://api.datafornerds.io/v2/windows-update-history.json")
          [ "$WIN10_CHANGED" = "true" ] && files+=("https://api.datafornerds.io/v2/windows-10-update-history.json")
          [ "$WIN11_CHANGED" = "true" ] && files+=("https://api.datafornerds.io/v2/windows-11-update-history.json")
          printf '%s\n' "${files[@]}" | jq -R . | jq -sc '{files:.}' | \
            curl -fsSL -X POST \
              "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @- \
            || echo "::warning::Cache purge failed — stale content will expire within 6h."

      - name: Create or update failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'collector-failure';
            const title = `[Collector Failure] ${{ github.workflow }}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The **${{ github.workflow }}** workflow failed.`,
              '',
              `- **Run:** ${runUrl}`,
              `- **Time:** ${new Date().toISOString()}`,
              `- **Trigger:** ${{ github.event_name }}`,
              '',
              `Check the [workflow logs](${runUrl}) for details.`
            ].join('\n');

            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch {
              await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'd73a4a' });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: label,
            });
            const existing = issues.find(i => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: `### Failure recurrence\n\n${body}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: [label],
              });
            }
