name: Get-WindowsUpdateHistory

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Prevent a workflow_dispatch run from overlapping an in-flight cron run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collector:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-collector.yml
    secrets: inherit
    with:
      collector: Get-WindowsUpdateHistory
      datasets: |
        [
          {
            "name": "windows-update-history",
            "minRecords": 500,
            "maxRecords": 6000,
            "requiredFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild", "FullVersion", "ReleaseDate", "ReleaseType", "IsExpired", "ArticleUrl"],
            "keyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "nonEmptyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "sourceUrls": [
              "https://support.microsoft.com/en-us/topic/windows-10-update-history-e6058e7c-4116-38f1-b984-4fcacfba5e5d",
              "https://aka.ms/Windows11UpdateHistory",
              "https://support.microsoft.com/en-us/servicing/os/hotpatch/windows-11/2026/release-notes-for-hotpatch-updates-on-windows-11-enterprise-version-26h2",
              "https://support.microsoft.com/en-us/topic/windows-server-2022-update-history-e1caa597-00c5-4ab9-9f3e-8212fe80b2ee"
            ]
          },
          {
            "name": "windows-10-update-history",
            "filter": { "field": "MajorVersion", "equals": 10 },
            "minRecords": 200,
            "maxRecords": 3000,
            "requiredFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild", "FullVersion", "ReleaseDate", "ReleaseType", "IsExpired", "ArticleUrl"],
            "keyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "nonEmptyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "sourceUrls": [
              "https://support.microsoft.com/en-us/topic/windows-10-update-history-e6058e7c-4116-38f1-b984-4fcacfba5e5d"
            ]
          },
          {
            "name": "windows-11-update-history",
            "filter": { "field": "MajorVersion", "equals": 11 },
            "minRecords": 50,
            "maxRecords": 2000,
            "requiredFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild", "FullVersion", "ReleaseDate", "ReleaseType", "IsExpired", "ArticleUrl"],
            "keyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "nonEmptyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "sourceUrls": [
              "https://aka.ms/Windows11UpdateHistory",
              "https://support.microsoft.com/en-us/servicing/os/hotpatch/windows-11/2026/release-notes-for-hotpatch-updates-on-windows-11-enterprise-version-26h2"
            ]
          },
          {
            "name": "windows-server-update-history",
            "filter": { "field": "OSType", "equals": "Server" },
            "minRecords": 50,
            "maxRecords": 2000,
            "requiredFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild", "FullVersion", "ReleaseDate", "ReleaseType", "IsExpired", "ArticleUrl"],
            "keyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "nonEmptyFields": ["OSType", "MajorVersion", "WindowsVersion", "KBNumber", "OSBuild"],
            "sourceUrls": [
              "https://support.microsoft.com/en-us/topic/windows-server-2022-update-history-e1caa597-00c5-4ab9-9f3e-8212fe80b2ee"
            ]
          }
        ]
