name: Release

on:
  # Human edits to the manifest (the GITHUB_TOKEN bot push from Version Bump
  # never fires push-triggered workflows, so that path arrives via workflow_run).
  push:
    branches: [main]
    paths:
      - 'Modules/DataForNerdsCollectors/DataForNerdsCollectors.psd1'
  workflow_run:
    workflows: ["Version Bump"]
    types: [completed]

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    # For workflow_run, only release after a successful bump.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # workflow_run checks out the default branch; pin to main's tip so the
          # version read below is the one the bump just pushed.
          ref: main

      - name: Extract version from manifest
        id: version
        shell: pwsh
        run: |
          $content = Get-Content 'Modules/DataForNerdsCollectors/DataForNerdsCollectors.psd1' -Raw
          $match = [regex]::Match($content, "ModuleVersion\s*=\s*'([\d.]+)'")
          if (-not $match.Success) {
            Write-Host "::error::ModuleVersion not found in manifest"
            exit 1
          }
          $version = $match.Groups[1].Value
          Write-Host "Version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Check if tag already exists
        id: check-tag
        run: |
          # Check the remote: the shallow checkout has no tags, so a local
          # rev-parse would always report "missing".
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
