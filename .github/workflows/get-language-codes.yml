name: Get-LanguageCodes

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Prevent a workflow_dispatch run from overlapping an in-flight cron run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collector:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-collector.yml
    secrets: inherit
    with:
      collector: Get-LanguageCodes
      datasets: |
        [
          {
            "name": "language-codes",
            "minRecords": 100,
            "maxRecords": 500,
            "requiredFields": ["LanguageCode", "Description", "BCP47"],
            "keyFields": ["LanguageCode"],
            "nonEmptyFields": ["LanguageCode"],
            "sourceUrls": [
              "https://learn.microsoft.com/en-us/openspecs/office_standards/ms-oe376/6c085406-a698-4e12-9d4d-c3b0ee3dbc4a"
            ]
          }
        ]
