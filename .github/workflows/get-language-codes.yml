name: Get-LanguageCodes

on:
  workflow_dispatch:

jobs:
  run-collector:
    name: Run Get-LanguageCodes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PowerShell (latest stable)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEB_URL=$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/PowerShell/PowerShell/releases/latest \
            | grep -oE '"browser_download_url": *"[^"]+deb_amd64\.deb"' \
            | head -n 1 \
            | sed -E 's/.*"(https[^"]+)".*/\1/')
          if [ -z "${DEB_URL}" ]; then
            echo "Could not resolve latest PowerShell .deb asset URL." >&2
            exit 1
          fi
          echo "Downloading: ${DEB_URL}"
          curl -fsSL -o /tmp/powershell.deb "${DEB_URL}"
          sudo dpkg -i /tmp/powershell.deb || sudo apt-get install -f -y
          pwsh --version

      - name: Fetch current JSON from R2
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 r2 object get dfn-collectors/v2/language-codes.json --file=current.json --remote

      - name: Run Get-LanguageCodes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module "$env:GITHUB_WORKSPACE/Modules/DataForNerdsCollectors/DataForNerdsCollectors.psd1" -Force

          $now     = [DateTime]::UtcNow.ToString('o')
          $results = Get-LanguageCodes
          Write-Host "Returned $($results.Count) record(s)."

          $currentFile = "$env:GITHUB_WORKSPACE/current.json"
          $uploadFile  = "$env:GITHUB_WORKSPACE/output.json"
          $lastModified = $null

          if (Test-Path $currentFile) {
              $current      = Get-Content $currentFile -Raw | ConvertFrom-Json
              $lastModified = $current.metadata.lastModified
              $newDataJson  = $results      | ConvertTo-Json -Depth 10 -Compress
              $oldDataJson  = $current.data | ConvertTo-Json -Depth 10 -Compress
              if ($newDataJson -ne $oldDataJson) {
                  Write-Host "Data has changed — updating lastModified."
                  $lastModified = $now
              } else {
                  Write-Host "Data unchanged — keeping lastModified: $lastModified"
              }
          } else {
              Write-Host "No existing data found — setting lastModified to now."
              $lastModified = $now
          }

          $envelope = [PSCustomObject]@{
              metadata = [PSCustomObject]@{
                  dataset      = 'language-codes'
                  sourceUrls   = @(
                      'https://learn.microsoft.com/en-us/openspecs/office_standards/ms-oe376/6c085406-a698-4e12-9d4d-c3b0ee3dbc4a'
                  )
                  generatedAt  = $now
                  lastModified = $lastModified
                  lastCollected = $now
              }
              data = $results
          }

          $envelope | ConvertTo-Json -Depth 10 | Set-Content -Path $uploadFile -Encoding utf8
          Write-Host "Envelope written to output.json"

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 r2 object put dfn-collectors/v2/language-codes.json --file=output.json --content-type=application/json --remote
