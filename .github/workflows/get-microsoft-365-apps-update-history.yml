name: Get-Microsoft365AppsUpdateHistory

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Prevent a workflow_dispatch run from overlapping an in-flight cron run.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collector:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/run-collector.yml
    secrets: inherit
    with:
      collector: Get-Microsoft365AppsUpdateHistory
      datasets: |
        [
          {
            "name": "m365-apps-update-history",
            "minRecords": 100,
            "maxRecords": 2000,
            "requiredFields": ["ReleaseDate", "ChannelName", "Version", "Build", "FullBuild"],
            "keyFields": ["ReleaseDate", "ChannelName", "Version", "Build"],
            "nonEmptyFields": ["ReleaseDate", "Version", "Build"],
            "sourceUrls": [
              "https://learn.microsoft.com/en-us/officeupdates/update-history-microsoft365-apps-by-date"
            ]
          }
        ]
